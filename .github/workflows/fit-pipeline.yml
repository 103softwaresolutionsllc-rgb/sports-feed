name: Fit pipeline weekly refit

# Quant Apparatus Phase C (spec §6.1): turn harvested seasons into
# versioned, gated FitArtifacts on the data branch.
#
#   extract (data/intelligence/raw on the data branch)
#   → refit (simulation-lab's shipping fit code)
#   → validation gate (count / plausible bands / leave-one-season-out
#     coverage / contract) — a sport that fails is NOT published and
#     the manifest keeps pointing at its last good artifact
#   → publish data/fits/<sport>-fit.json + data/fits/manifest.json
#
# Cadence: weekly, Mondays 08:13 UTC — after the daily harvest
# (06:23 UTC) and the nightly grading run (07:47 UTC), so the week's
# games are in the raw store before the refit reads them. Also run
# by hand (workflow_dispatch) whenever a sport's held seasons grow.
#
# STATUS: created locally with Phase C, NOT yet pushed — the repo's
# gh token lacks the `workflow` scope, so this file lands on GitHub
# through the web UI or Isaac's push, like grading.yml before it.
#
# RUNNER REQUIREMENT: the pipeline's canonical home is the
# simulation-lab working tree (scripts/fit-pipeline.mjs), which is
# not yet mirrored into git, and the player fan-out logs live outside
# this repo. On a GitHub-hosted runner the refit step below therefore
# SKIPS with the manual command printed — the operative cadence until
# simulation-lab is mirrored (or a self-hosted runner on the Legion
# provides both checkouts side by side) is:
#
#   cd ~/workspace/simulation-lab
#   node scripts/fit-pipeline.mjs
#
# When a `simulation-lab` checkout exists beside this job's `work`
# checkout, the same workflow runs the pipeline end-to-end and
# commits the published fits to the data branch.

on:
  schedule:
    - cron: "13 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: work

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refit + gate + publish (when a simulation-lab checkout is present)
        working-directory: work
        run: |
          LAB="$GITHUB_WORKSPACE/simulation-lab"
          if [ ! -f "$LAB/scripts/fit-pipeline.mjs" ]; then
            echo "::warning::simulation-lab checkout not present beside this job — skipping the refit."
            echo "Run by hand: cd ~/workspace/simulation-lab && node scripts/fit-pipeline.mjs"
            exit 0
          fi
          node "$LAB/scripts/fit-pipeline.mjs" \
            --data-root "$GITHUB_WORKSPACE/work/data/intelligence" \
            --publish-root "$GITHUB_WORKSPACE/work/data/fits"

      - name: Commit data branch
        working-directory: work
        run: |
          git config user.name "Isaac Jones"
          git config user.email "103softwaresolutionsllc@gmail.com"
          git add -A data/fits
          if git diff --cached --quiet; then
            echo "No fit changes."
          else
            git commit -m "Fit pipeline refit $(date -u +%F)"
            git push origin HEAD:data
          fi
